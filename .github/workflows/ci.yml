name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar todos los .py
        run: python -m py_compile *.py
      - name: Bloquear datos de planta
        run: |
          if git ls-files | grep -Ei '\.(csv|json|png)$'; then
            echo "Hay datos de planta en el repo; deben quedarse en local." && exit 1
          fi
