name: Demo page
on:
  pull_request:
    paths: ["synthetic_demo/**", ".github/workflows/pages.yml"]
  push:
    branches: [main]
    paths: ["synthetic_demo/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas
      - run: python synthetic_demo/build_demo_page.py site/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-vibration-demo
          path: site/
